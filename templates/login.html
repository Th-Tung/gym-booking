{{ define "content" }}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card card-custom p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-3">
            <i class="bi bi-shield-lock-fill fs-2"></i>
          </div>
          <h3 class="fw-bold mb-1">เข้าสู่ระบบ GymPulse</h3>
          <p class="text-muted small">เข้าสู่ระบบเพื่อจองและจัดการเครื่องเล่นของคุณ</p>
        </div>

        {{ if .Data.Error }}
          <div class="alert alert-danger border-0 d-flex align-items-center">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div>{{ .Data.Error }}</div>
          </div>
        {{ end }}

        <form method="POST" action="/login">
          <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">

          <div class="mb-3">
            <label class="form-label" for="email"><i class="bi bi-envelope me-1"></i> อีเมล</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ .Data.Email }}" placeholder="member@gym.com" required autofocus>
          </div>

          <div class="mb-4">
            <label class="form-label" for="password"><i class="bi bi-key me-1"></i> รหัสผ่าน</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-gym-primary w-100 py-2 fs-6">
            <i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary">
          <p class="text-muted small mb-0">ยังไม่มีบัญชีสมาชิก? <a href="/register" class="text-success fw-bold text-decoration-none">สมัครสมาชิกใหม่</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{{ end }}
